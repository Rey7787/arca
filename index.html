<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificação de ambiente — Gestor de Gastos</title>
<style>
  :root {
    --papel:   #F2F3F1;
    --tinta:   #16191C;
    --fraco:   #797F85;
    --linha:   #C9CCC7;
    --ok:      #1B6B4A;
    --falha:   #A32B2B;
    --alerta:  #8A6410;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--papel);
    color: var(--tinta);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 34rem;
  }

  header {
    border-bottom: 2px solid var(--tinta);
    padding-bottom: .75rem;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin: 0;
  }

  .meta {
    color: var(--fraco);
    font-size: .8rem;
    margin-top: .35rem;
    word-break: break-all;
  }

  .grupo {
    margin: 1.75rem 0 .5rem;
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--fraco);
  }

  .item {
    display: flex;
    align-items: baseline;
    gap: .5rem;
    padding: .3rem 0;
  }

  .nome { white-space: nowrap; }

  .pontos {
    flex: 1;
    border-bottom: 1px dotted var(--linha);
    transform: translateY(-.25em);
    min-width: 1rem;
  }

  .estado {
    white-space: nowrap;
    font-weight: 700;
    color: var(--fraco);
  }

  .ok     { color: var(--ok); }
  .falha  { color: var(--falha); }
  .alerta { color: var(--alerta); }

  .nota {
    font-size: .78rem;
    color: var(--fraco);
    margin: -.15rem 0 .4rem 0;
    padding-left: .1rem;
  }

  .total {
    margin-top: 2rem;
    border-top: 2px solid var(--tinta);
    padding-top: .9rem;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }

  .veredito { font-size: .82rem; font-weight: 400; color: var(--fraco); margin-top: .6rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Verificação de ambiente</h1>
    <div class="meta" id="meta">carregando…</div>
  </header>

  <div class="grupo">Obrigatório</div>
  <div id="obrigatorio"></div>

  <div class="grupo">Opcional</div>
  <div id="opcional"></div>

  <div class="total">
    <span>Resultado</span>
    <span id="resultado">—</span>
  </div>
  <p class="veredito" id="veredito"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);

function linha(container, nome, estado, classe, nota) {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML =
    '<span class="nome"></span><span class="pontos"></span><span class="estado"></span>';
  div.querySelector('.nome').textContent = nome;
  const e = div.querySelector('.estado');
  e.textContent = estado;
  e.classList.add(classe);
  container.appendChild(div);
  if (nota) {
    const p = document.createElement('p');
    p.className = 'nota';
    p.textContent = nota;
    container.appendChild(p);
  }
}

function testarIndexedDB() {
  return new Promise((ok, erro) => {
    if (!('indexedDB' in window)) return erro(new Error('indisponível'));
    const req = indexedDB.open('teste-ambiente', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('itens', { keyPath: 'id' });
    req.onerror = () => erro(req.error || new Error('bloqueado'));
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('itens', 'readwrite');
      tx.objectStore('itens').put({ id: 'x', valor: 3000 });
      tx.oncomplete = () => {
        const leitura = db.transaction('itens', 'readonly').objectStore('itens').get('x');
        leitura.onsuccess = () => {
          db.close();
          indexedDB.deleteDatabase('teste-ambiente');
          leitura.result && leitura.result.valor === 3000
            ? ok()
            : erro(new Error('leitura divergente'));
        };
        leitura.onerror = () => erro(leitura.error);
      };
      tx.onerror = () => erro(tx.error);
    };
  });
}

(async function () {
  $('meta').textContent = location.protocol + '//' + (location.host || '(sem host)');

  const obr = $('obrigatorio');
  const opc = $('opcional');
  let falhas = 0;

  // Contexto seguro
  if (window.isSecureContext) {
    linha(obr, 'Contexto seguro', 'OK', 'ok');
  } else {
    falhas++;
    linha(obr, 'Contexto seguro', 'FALHOU', 'falha',
      'Abra por http://localhost ou https. O protocolo file:// desativa as APIs abaixo.');
  }

  // UUID
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    linha(obr, 'crypto.randomUUID', 'OK', 'ok');
  } else {
    falhas++;
    linha(obr, 'crypto.randomUUID', 'FALHOU', 'falha',
      'Sem isso não há como gerar id de lançamento no cliente.');
  }

  // IndexedDB
  try {
    await testarIndexedDB();
    linha(obr, 'IndexedDB grava e lê', 'OK', 'ok');
  } catch (e) {
    falhas++;
    linha(obr, 'IndexedDB grava e lê', 'FALHOU', 'falha',
      'Motivo: ' + e.message + '. Modo anônimo restrito ou file:// costumam causar isso.');
  }

  // localStorage
  try {
    localStorage.setItem('__t', '1');
    localStorage.removeItem('__t');
    linha(obr, 'localStorage', 'OK', 'ok');
  } catch (e) {
    falhas++;
    linha(obr, 'localStorage', 'FALHOU', 'falha', 'É onde o token do GitHub ficaria guardado.');
  }

  // Centavos
  const soma = (10 + 20) / 100;
  linha(obr, 'Aritmética em centavos', soma === 0.3 ? 'OK' : 'FALHOU', soma === 0.3 ? 'ok' : 'falha');

  // --- Opcional ---

  // Web Crypto
  if (typeof crypto !== 'undefined' && crypto.subtle) {
    linha(opc, 'Web Crypto (PIN cifrado)', 'OK', 'ok');
  } else {
    linha(opc, 'Web Crypto (PIN cifrado)', 'AUSENTE', 'alerta',
      'O PIN só poderá trancar a tela, sem criptografar os dados.');
  }

  // Armazenamento persistente
  if (navigator.storage && navigator.storage.persist) {
    const jaPersistido = await navigator.storage.persisted();
    const concedido = jaPersistido || await navigator.storage.persist();
    linha(opc, 'Armazenamento persistente', concedido ? 'CONCEDIDO' : 'NEGADO',
      concedido ? 'ok' : 'alerta',
      concedido ? null : 'O navegador pode descartar os dados sob pressão de espaço.');
  } else {
    linha(opc, 'Armazenamento persistente', 'AUSENTE', 'alerta');
  }

  // File System Access
  if ('showSaveFilePicker' in window) {
    linha(opc, 'Gravar em arquivo no disco', 'OK', 'ok');
  } else {
    linha(opc, 'Gravar em arquivo no disco', 'AUSENTE', 'alerta',
      'Esperado no celular e no Firefox. Use exportar/importar JSON nesses casos.');
  }

  // Rede
  linha(opc, 'Conexão', navigator.onLine ? 'ONLINE' : 'OFFLINE',
    navigator.onLine ? 'ok' : 'alerta');

  const r = $('resultado');
  if (falhas === 0) {
    r.textContent = 'APROVADO';
    r.className = 'ok';
    $('veredito').textContent = 'O ambiente suporta tudo que a especificação exige. Pode construir.';
  } else {
    r.textContent = falhas + (falhas === 1 ? ' FALHA' : ' FALHAS');
    r.className = 'falha';
    $('veredito').textContent = 'Corrija os itens obrigatórios antes de escrever o app. Os opcionais podem faltar sem problema.';
  }
})();
</script>
</body>
</html>
